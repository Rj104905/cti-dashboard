name: Update CTI Data

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:           # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch CTI data
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python scripts/fetch_cti.py

      - name: Commit updated data
        run: |
          git config user.name  "CTI Bot"
          git config user.email "cti-bot@users.noreply.github.com"
          git add data/cti_data.json
          git diff --staged --quiet \
            || git commit -m "data: update CTI feeds $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
